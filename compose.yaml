# The intake service in a container, the way it would ship.
#   docker compose up --build     then   http://localhost:8080
name: intake-poc
services:
  intake:
    build: .
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}
      # Outage drill: point this at an address that never answers.
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
    ports: ['8080:8080']
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 2s
      retries: 3
