# xcodegen generate  →  BPPathway.xcodeproj (generated, not checked in)
name: BPPathway
options:
  bundleIdPrefix: dev.waits
  deploymentTarget:
    iOS: "17.0"
packages:
  BPPathway:
    path: ..
targets:
  BPPathway:
    type: application
    platform: iOS
    # Fonts and logo match the intake POC (docs/prototypes): Poppins, Open Sans, both OFL.
    sources: [Sources, Fonts, Assets.xcassets]
    dependencies:
      - package: BPPathway
        product: BPCore
      - package: BPPathway
        product: HealthSync
    entitlements:
      path: BPPathway.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BP Pathway
        UILaunchScreen: {}
        UIAppFonts: [Poppins-Light.ttf, Poppins-Regular.ttf, OpenSans-Regular.ttf, OpenSans-SemiBold.ttf, OpenSans-Bold.ttf]
        NSHealthShareUsageDescription: >-
          Rezilient reads your blood pressure and your Apple Watch's hypertension notifications to run
          your blood pressure check. Your care team sees readings once you start a check. Your employer never does.
        NSHealthUpdateUsageDescription: >-
          Test builds only: adds a synthetic week of readings. The member app never writes health data.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waits.bppathway
        # The catalog holds the logo only; no app icon in a spike.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets: [BPPathwayUITests]
  BPPathwayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BPPathway
    info:
      path: UITests.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waits.bppathway.uitests
        SWIFT_VERSION: "6.0"
