<style>
body { overflow-x: auto; padding: 28px 16px; }
.board { width: 1320px; margin: 0 auto; background: var(--bg); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(13, 34, 64, 0.14); font-size: 14px; line-height: 1.5; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; min-height: 780px; }
.rail { align-self: stretch; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px; background: var(--white); border-right: 1px solid var(--line); }
.search { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.search input { height: 40px; padding: 0 12px; border: 1px solid var(--field); border-radius: 6px; font: inherit; font-size: 14px; font-weight: 400; color: var(--ink); background: var(--white); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--navy); font-size: 13px; font-weight: 600; }
.filters button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--white); }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.qrow { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 1px 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: var(--ink); text-align: left; }
.qrow[aria-current="true"] { background: var(--blue-card); box-shadow: inset 0 0 0 2px var(--navy); }
.qrow .t { grid-row: span 3; padding-top: 1px; font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.qrow .n { font-size: 14px; font-weight: 700; }
.qrow .p { font-size: 12px; color: var(--muted); }
.qrow .s { justify-self: start; margin-top: 5px; font-size: 12px; }
.empty { margin: 0; padding: 6px 2px; font-size: 13px; color: var(--ink-2); }
.chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); font-size: 13px; }
.h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: var(--ink); text-align: left; }
/* biome-ignore lint/complexity/noImportantStyles: a selected row must win over its inline background */
.sel { background: var(--blue-card) !important; box-shadow: inset 0 0 0 2px var(--navy); }
.vital { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.vital:last-child { border-bottom: 0; }
.vital b { font-size: 14px; }
.src { display: inline-flex; padding: 0 8px; border-radius: 6px; background: var(--blue-card); color: var(--navy); font-size: 12px; font-weight: 600; }
.src.typed { background: var(--white); border: 1px solid var(--field); color: var(--ink-2); }
</style>
</head>

led","v":"Former smoker, quit 2019"},{"s":"history","q":"How often do you drink alcohol?","st":"ask"},{"s":"screening","q":"Over the last 2 weeks, how often have you felt down, or had little interest in things?","st":"ask"},{"s":"screening","q":"Have you fallen in the past year?","st":"answered","w":{"q":"Did they already say whether the patient has fallen recently?","p":100,"r":"p(answered) ≥ 0.7 → skip, else ask"}},{"s":"visit","q":"When did this start?","st":"ask","w":{"q":"Did they already say when the symptoms started or how long they have lasted?","p":21,"r":"p(answered) ≥ 0.7 → skip, else ask"}},{"s":"visit","q":"Have you had a fever?","st":"ask","w":{"q":"Did they already say whether the patient has or has not had a fever?","p":0,"r":"p(answered) ≥ 0.7 → skip, else ask"}},{"s":"visit","q":"Is your cough dry, or are you coughing anything up?","st":"ask","w":{"q":"Did they already say whether the cough is dry or produces mucus or phlegm?","p":0,"r":"p(answered) ≥ 0.7 → skip, else ask"}},{"s":"visit","q":"Do you get short of breath? When?","st":"ask","w":{"q":"Did they already say whether the patient feels short of breath, and when?","p":36,"r":"p(answered) ≥ 0.7 → skip, else ask"}}]},"walter_degraded":{"ms":null,"c":{"prefilled":6,"confirm":3,"sign":3,"answered":0,"ask":14,"total":26},"set":"navigator_review","esc":[],"cx":[],"sw":null,"dev":["otoscope","stethoscope","exam camera","pulse oximeter"],"tests":[],"f":[{"s":"registration","q":"Full legal name","st":"prefilled","v":"Walter Synthetic"},{"s":"registration","q":"Date of birth","st":"prefilled","v":"1953-11-02"},{"s":"registration","q":"Sex","st":"prefilled","v":"male"},{"s":"registration","q":"Home address","st":"prefilled","v":"400 Oak Ave, Stillwater, OK, 74074"},{"s":"registration","q":"Phone number","st":"prefilled","v":"555-0187"},{"s":"registration","q":"Email","st":"ask"},{"s":"registration","q":"Preferred language","st":"ask"},{"s":"registration","q":"Emergency contact: name, relationship, phone","st":"ask"},{"s":"registration","q":"Employer","st":"ask"},{"s":"registration","q":"Member ID","st":"ask"},{"s":"registration","q":"Preferred pharmacy","st":"ask"},{"s":"consent","q":"Consent to treatment","st":"sign"},{"s":"consent","q":"Consent to telehealth","st":"sign"},{"s":"consent","q":"Notice of privacy practices","st":"sign"},{"s":"history","q":"Medications you take now","st":"confirm","v":"albuterol inhaler; atorvastatin 40 MG Oral Tablet"},{"s":"history","q":"Allergies","st":"ask"},{"s":"history","q":"Ongoing health conditions","st":"confirm","v":"COPD; Coronary artery disease"},{"s":"history","q":"Past surgeries","st":"confirm","v":"Coronary artery bypass graft"},{"s":"history","q":"Family medical history","st":"ask"},{"s":"history","q":"Do you smoke, vape or use tobacco?","st":"prefilled","v":"Former smoker, quit 2019"},{"s":"history","q":"How often do you drink alcohol?","st":"ask"},{"s":"screening","q":"Over the last 2 weeks, how often have you felt down, or had little interest in things?","st":"ask"},{"s":"screening","q":"Have you fallen in the past year?","st":"ask"},{"s":"visit","q":"When did this start?","st":"ask"},{"s":"visit","q":"On a scale of 0 to 10, how bad is it?","st":"ask"},{"s":"visit","q":"What have you tried so far?","st":"ask"}]}};

  maria: { name: 'Maria', age: 52, words: "ear's been killing me 3 days, also need my lisinopril refilled", summary: ['Adult', 'Female', 'Hypertension', 'lisinopril 10 mg', 'Allergy: penicillin'] },
  walter: { name: 'Walter', age: 72, words: "chest feels tight when I walk up stairs and I'm coughing more than usual, took a tumble last week", summary: ['Older adult', 'Male', 'COPD', 'Coronary artery disease', 'albuterol inhaler', 'atorvastatin 40 mg', 'No allergies on file'] },

// Home readings, the same list the member sees on the Vitals screen, with where each number came from.
const VITALS = {
  walter: [
    { m: 'Blood pressure', v: '128/82 mmHg', src: 'Omron cuff via Apple Health', age: '2 days ago', typed: false, stale: false },
    { m: 'Resting heart rate', v: '64 bpm', src: 'Apple Watch via Apple Health', age: 'today', typed: false, stale: false },
    { m: 'Sleep', v: '6 h 10 m', src: 'Whoop account', age: 'last night', typed: false, stale: false },
    { m: 'Weight', v: '192 lb', src: 'Entered by patient', age: '3 weeks ago', typed: true, stale: true },
  ],
  maria: [],
};

const SETTING = {
  provider_now: { label: 'Provider now', cls: 'chip-pink' },
  clinic: { label: 'Clinic visit', cls: 'chip-green' },
  navigator_review: { label: 'Navigator review', cls: 'chip-grey' },
};

// The not-screened state (automated screening didn't run for these intakes) is reachable with ?degraded=1.
const state = { who: 'walter', down: new URLSearchParams(location.search).get('degraded') === '1', sel: null, q: '', filter: 'all' };
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0d2240" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg>';

function prepView(row) {
  const { down, sel } = state;
  const who = row.id;
  const run = DATA[down ? `${who}_degraded` : who];
  const p = PEOPLE[who];
  const on = (k) => sel === k;
  const fk = (f) => `f:${f.q}`;
  const answered = run.f.filter((f) => f.st === 'answered');
  const toAsk = run.f.filter((f) => f.st === 'ask' && f.w);
  const setting = SETTING[run.set];
  const vitals = VITALS[who];

  const decisions = [];
  if (!down) {
    const row = (key, kind, q, pct, r, out, tone) => ({ key, kind, q, pct, r, out, tone });
    if (run.sw) decisions.push(row('setting', 'Where the visit happens', run.sw.q, run.sw.p, run.sw.r, setting.label, run.set === 'provider_now' ? 'flag' : 'skip'));
    for (const e of run.esc) decisions.push(row(`e:${e.l}`, 'Red flag', e.q, e.p, e.r, 'Escalate', 'flag'));
    for (const x of run.cx) decisions.push(row(`c:${x.l}`, 'Complaint', x.q, x.p, x.r, `Load ${x.l.toLowerCase()} questions`, 'skip'));
    for (const f of run.f.filter((f) => f.w)) decisions.push(row(fk(f), `Form: ${f.q}`, f.w.q, f.w.p, f.w.r, f.st === 'answered' ? 'Skip, already answered' : 'Ask', f.st === 'answered' ? 'skip' : 'ask'));
  }
  const toneBar = (t) => (t === 'flag' ? 'var(--pink)' : 'var(--navy)');
  const toneOut = (t) => (t === 'flag' ? 'chip-pink' : t === 'skip' ? 'chip-green' : 'chip-grey');
  const n = run.c.answered;
  const providerLine = down
    ? 'None today: every history question will be asked again in the visit.'
    : `${n} question${n === 1 ? '' : 's'} already answered in their words, ${run.c.confirm} history items confirmed before the call${run.esc.length ? ', and the red flag arrives first.' : '.'}`;

  return `
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 22px 24px 28px;">
    <section class="card" aria-label="What came in" style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; padding: 20px 24px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 class="eyebrow">Why ${h(p.name)} is coming in, in their words</h2>
        <p style="margin: 0; font-family: var(--title); font-weight: 300; font-size: 24px; line-height: 1.35; color: var(--ink);">“${h(p.words)}”</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 class="eyebrow">What the assistant sees from the chart</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">${p.summary.map((c) => `<span class="chip">${h(c)}</span>`).join('')}</div>
        <span style="font-size: 12px; color: var(--muted);">Shared without names, IDs, contact details or dates.</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start;">
      <section class="card" aria-label="Prep card" style="display: flex; flex-direction: column; gap: 18px; padding: 20px 22px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column;">
            <span style="font-family: var(--title); font-size: 24px; font-weight: 300;">${h(p.name)}, ${p.age}</span>
            <span style="font-size: 13px; color: var(--ink-2);">${h(row.provider)} · Clayton Clinic · Oct 14, ${h(row.time)}</span>
          </div>
          <span class="${setting.cls}">${h(setting.label)}</span>
        </div>

        ${run.esc.map((e) => `
        <button type="button" data-key="esc-${h(e.l)}" data-act="sel" data-v="${h(`e:${e.l}`)}" class="${on(`e:${e.l}`) || on('setting') ? 'sel' : ''}" style="display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 12px 14px; border: 1px solid var(--pink); border-radius: 6px; background: var(--pink-soft); text-align: left; color: inherit;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pink-ink);">Red flag · ${e.p}%</span>
          <span style="font-size: 16px; font-weight: 700;">${h(e.l)}</span>
          <span style="font-size: 13px; color: var(--ink-2);">Sent to the remote provider before the patient sits down. Never shown to the patient.</span>
        </button>`).join('')}

        ${down ? `
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--blue-card); border-radius: 6px;">
          <span style="font-size: 14px; font-weight: 700;">Not screened</span>
          <span style="font-size: 13px; color: var(--ink-2);">This intake wasn't checked for red flags or complaints, so please triage it.</span>
        </div>` : ''}

        ${run.cx.length ? `
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h3 class="h3">Reason for visit</h3>
          ${run.cx.map((x) => `
          <button type="button" data-key="cx-${h(x.l)}" data-act="sel" data-v="${h(`c:${x.l}`)}" class="item ${on(`c:${x.l}`) ? 'sel' : ''}">
            <span style="font-weight: 600;">${h(x.l)}</span><span style="color: var(--muted); font-variant-numeric: tabular-nums;">${x.p}%</span>
          </button>`).join('')}
        </div>` : ''}

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h3 class="h3">Home vitals</h3>
          ${vitals.length ? vitals.map((v) => `
          <div class="vital">
            <span>${h(v.m)}</span>
            <span><b>${h(v.v)}</b> <span class="src ${v.typed ? 'typed' : ''}">${h(v.src)}</span></span>
            <span style="color: var(--ink-2); white-space: nowrap;">${h(v.age)}${v.stale ? ' <span class="chip-grey" style="font-size: 12px;">Stale</span>' : ''}</span>
          </div>`).join('') : '<span style="font-size: 13px; color: var(--ink-2);">No devices connected. Vitals will be taken in the clinic.</span>'}
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h3 class="h3">Medic: have ready</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            ${run.dev.map((d) => `<span style="padding: 3px 12px; border-radius: 999px; background: var(--navy); color: var(--white); font-size: 13px;">${h(d)}</span>`).join('')}
            <span class="chip" style="border-radius: 999px;">standard vitals</span>
          </div>
          ${run.tests.map((t) => `<span style="font-size: 13px;">Test: ${h(t)}</span>`).join('')}
        </div>

        ${answered.length ? `
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h3 class="h3">Answered in their words</h3>
          ${answered.map((f) => `
          <button type="button" data-key="ca-${h(f.q)}" data-act="sel" data-v="${h(fk(f))}" class="item ${on(fk(f)) ? 'sel' : ''}">
            <span style="display: flex; align-items: center; gap: 8px;">${CHECK}${h(f.q)}</span><span style="font-size: 13px; color: var(--muted);">skipped</span>
          </button>`).join('')}
        </div>` : ''}

        ${toAsk.length ? `
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h3 class="h3">Asked on the intake form</h3>
          ${toAsk.map((f) => `
          <button type="button" data-key="ta-${h(f.q)}" data-act="sel" data-v="${h(fk(f))}" class="item ${on(fk(f)) ? 'sel' : ''}">
            <span>${h(f.q)}</span><span style="font-size: 13px; color: var(--muted);">asked</span>
          </button>`).join('')}
        </div>` : ''}

        <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line);">
          <h3 class="h3">Provider's time back</h3>
          <span>${h(providerLine)}</span>
        </div>
      </section>

      <section class="card" aria-label="How the intake assistant decided" style="display: flex; flex-direction: column; overflow: hidden;">
        ${!down ? `
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 18px 22px; border-bottom: 1px solid var(--line);">
          <h2 style="margin: 0; font-family: var(--title); font-weight: 400; font-size: 20px;">How the intake assistant decided</h2>
          <span style="font-size: 13px; color: var(--ink-2);">Each row is one question the assistant answered, with its probability and the rule applied. Click a row to find it on the prep card.</span>
        </div>
        <div style="display: flex; flex-direction: column;">
          ${decisions.map((d) => `
          <button type="button" data-key="d-${h(d.key)}" data-act="sel" data-v="${h(d.key)}" aria-pressed="${on(d.key)}" class="${on(d.key) ? 'sel' : ''}" style="display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 14px 22px; border: 0; border-bottom: 1px solid var(--line-2); text-align: left; color: inherit; background: var(--white);">
            <span class="eyebrow" style="font-size: 11px;">${h(d.kind)}</span>
            <span style="font-size: 14px;">${h(d.q)}</span>
            <span style="display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; gap: 12px; width: 100%;">
              <span style="display: block; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden;"><span style="display: block; height: 100%; width: ${Math.max(d.pct, 1)}%; background: ${toneBar(d.tone)};"></span></span>
              <span style="font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums;">${d.pct}%</span>
            </span>
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
              <span style="font-family: var(--mono); font-size: 12px; color: var(--muted);">${h(d.r)}</span>
              <span class="${toneOut(d.tone)}" style="flex: none; font-size: 12px;">${h(d.out)}</span>
            </span>
          </button>`).join('')}
        </div>` : `
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 24px;">
          <h2 style="margin: 0; font-family: var(--title); font-weight: 400; font-size: 20px;">How the intake assistant decided</h2>
          <p style="margin: 0; color: var(--ink-2);">No automated screening for this intake.</p>
        </div>`}
        <div style="padding: 12px 22px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--bg);">Recorded 9 Oct 2026 on synthetic patients. The rules are fixed and reviewed; the assistant only answers the questions.</div>
      </section>
    </div>
  </div>`;
}

// Today's queue. Walter and Maria carry the real recorded runs; the others are synthetic placeholders
// with no model output, so nothing is shown for them that the model didn't actually produce.
const QUEUE = [
  { id: 'walter', time: '10:30 am', name: 'Walter', age: 72, provider: 'Dana Ruiz, NP', data: true },
  { id: 'maria', time: '11:00 am', name: 'Maria', age: 52, provider: 'Dana Ruiz, NP', data: true },
  { id: 'okafor', time: '11:30 am', name: 'J. Okafor', age: 34, provider: 'Dana Ruiz, NP', status: 'not_filled' },
  { id: 'patel', time: '12:00 pm', name: 'R. Patel', age: 61, provider: 'Sam Lee, MD', status: 'in_progress' },
  { id: 'chen', time: '1:30 pm', name: 'L. Chen', age: 45, provider: 'Sam Lee, MD', status: 'not_filled' },
  { id: 'morales', time: '2:00 pm', name: 'D. Morales', age: 29, provider: 'Dana Ruiz, NP', status: 'completed' },
];

function statusOf(row) {
  if (row.data) {
    if (state.down) return { label: 'Needs triage', cls: 'chip-grey', flag: false, review: true };
    if (DATA[row.id].esc.length) return { label: 'Provider now', cls: 'chip-pink', flag: true, review: true };
    return { label: 'Intake completed', cls: 'chip-green', flag: false, review: true };
  }
  if (row.status === 'in_progress') return { label: 'In progress · 9 of 15', cls: 'chip', flag: false, review: false };
  if (row.status === 'completed') return { label: 'Intake completed', cls: 'chip-green', flag: false, review: true };
  return { label: 'Intake form not filled', cls: 'chip', flag: false, review: false };
}

const FILTERS = [
  { id: 'all', label: 'All', test: () => true },
  { id: 'review', label: 'Needs review', test: (st) => st.review },
  { id: 'flags', label: 'Red flags', test: (st) => st.flag },
];

function visibleRows() {
  const f = FILTERS.find((x) => x.id === state.filter);
  const q = state.q.trim().toLowerCase();
  return QUEUE.map((row, order) => ({ row, order, st: statusOf(row) }))
    .filter(({ row, st }) => f.test(st) && (!q || row.name.toLowerCase().includes(q)))
    .sort((a, b) => Number(b.st.flag) - Number(a.st.flag) || a.order - b.order);
}

function renderQueue() {
  const rows = visibleRows();
  let empty = 'No visits match.';
  if (state.filter === 'flags' && state.down) empty = 'No red flags. These intakes weren\'t screened, so each one needs triage.';
  document.getElementById('queue').innerHTML = rows.length
    ? rows.map(({ row, st }) => `
      <li><button type="button" class="qrow" data-key="q-${row.id}" data-act="pick" data-v="${row.id}" aria-current="${state.who === row.id}">
        <span class="t">${h(row.time)}</span>
        <span class="n">${h(row.name)}, ${row.age}</span>
        <span class="p">${h(row.provider)}</span>
        <span class="s ${st.cls}">${h(st.label)}</span>
      </button></li>`).join('')
    : `<li><p class="empty">${h(empty)}</p></li>`;
}

function placeholderView(row) {
  const st = statusOf(row);
  const note = row.status === 'not_filled'
    ? 'No intake answers yet. The intake form has not been started.'
    : row.status === 'in_progress'
      ? 'Intake in progress: 9 of 15 items covered. Answers show here once the patient sends it.'
      : 'Intake completed. In this prototype the prep card example is limited to Walter and Maria.';
  return `
  <div style="padding: 22px 24px 28px;">
    <section class="card" aria-label="Visit" style="display: flex; flex-direction: column; gap: 14px; max-width: 560px; padding: 22px 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-family: var(--title); font-size: 24px; font-weight: 300;">${h(row.name)}, ${row.age}</span>
          <span style="font-size: 13px; color: var(--ink-2);">${h(row.provider)} · Clayton Clinic · Oct 14, ${h(row.time)}</span>
        </div>
        <span class="${st.cls}">${h(st.label)}</span>
      </div>
      <p style="margin: 0; color: var(--ink-2);">${h(note)}</p>
      <span style="font-size: 12px; color: var(--muted);">Synthetic placeholder. No screening results or vitals are shown for this visit.</span>
    </section>
  </div>`;
}

function render() {
  const row = QUEUE.find((r) => r.id === state.who);
  const counts = Object.fromEntries(FILTERS.map((f) => [f.id, QUEUE.filter((r) => f.test(statusOf(r))).length]));
  document.getElementById('app').innerHTML = `
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 64px; padding: 0 28px; background: var(--white); border-bottom: 1px solid var(--line);">
    <div style="display: flex; align-items: center; gap: 16px;">
      <img class="wordmark" src="assets/rezilient-logo.svg" alt="Rezilient">
      <span style="width: 1px; height: 22px; background: var(--line);"></span>
      <span style="font-size: 14px; font-weight: 600; color: var(--ink-2);">Clinician · Visit prep</span>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);"><span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; background: var(--blue-card); color: var(--navy); font-size: 12px; font-weight: 700;">DR</span>Dana Ruiz, NP</span>
  </header>
  <div class="layout">
    <aside class="rail" aria-label="Today's visits">
      <div style="display: flex; flex-direction: column;">
        <h2 style="margin: 0; font-family: var(--title); font-weight: 400; font-size: 20px;">Today</h2>
        <span style="font-size: 13px; color: var(--ink-2);">Clayton Clinic · Oct 14 · ${QUEUE.length} visits</span>
      </div>
      <label class="search" for="q">Search patients<input id="q" type="search" autocomplete="off" placeholder="Name" value="${h(state.q)}"></label>
      <div class="filters" role="group" aria-label="Filter visits">
        ${FILTERS.map((f) => `<button type="button" data-key="f-${f.id}" data-act="filter" data-v="${f.id}" aria-pressed="${state.filter === f.id}">${h(f.label)} ${counts[f.id]}</button>`).join('')}
      </div>
      <ul class="queue" id="queue"></ul>
    </aside>
    <main style="min-width: 0;">${row.data ? prepView(row) : placeholderView(row)}</main>
  </div>`;
  renderQueue();
}

document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const key = b.dataset.key;
  const { act, v } = b.dataset;
  if (act === 'pick') Object.assign(state, { who: v, sel: null });
  if (act === 'filter') state.filter = v;
  if (act === 'sel') state.sel = state.sel === v ? null : v;
  render();
  const again = key && [...document.querySelectorAll('[data-key]')].find((el) => el.dataset.key === key);
  if (again) again.focus();
});

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  renderQueue();
});

render();
</script>
</body>
</html>
