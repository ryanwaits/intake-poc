# Intake service SLOs. Source of truth; `bun run ops:slo` generates ops/prometheus/rules/intake-slo.yml.
# 30-day windows (Sloth default).
# `or vector(0)`: with no errors there is no error series, and an empty ratio would hide the SLI.
# le=~"1(\.0)?": Prometheus 3 normalizes bucket labels, so le="1" is stored as le="1.0".
# Page alerts burn the budget fast, ticket alerts slowly (Sloth's multi-window defaults).
version: prometheus/v1
service: intake
labels:
  team: platform
slos:
  - name: intake-availability
    objective: 99.9
    description: Intake requests answered without a server error. Degraded plans are answers.
    sli:
      events:
        error_query: (sum(rate(intake_http_requests_total{route="/v1/intake",status=~"5.."}[{{.window}}])) or vector(0))
        total_query: sum(rate(intake_http_requests_total{route="/v1/intake"}[{{.window}}]))
    alerting:
      name: IntakeAvailability
      labels: { category: availability }
      annotations:
        summary: Intake requests are failing with server errors.
        runbook: ops/runbooks/intake-errors.md
      page_alert: { labels: { severity: page } }
      ticket_alert: { labels: { severity: ticket } }

  - name: intake-latency
    objective: 99
    description: Intake requests answered in under 1 second. The patient form is interactive.
    sli:
      events:
        error_query: |
          sum(rate(intake_http_request_duration_seconds_count{route="/v1/intake"}[{{.window}}]))
          -
          sum(rate(intake_http_request_duration_seconds_bucket{route="/v1/intake",le=~"1(\\.0)?"}[{{.window}}]))
        total_query: sum(rate(intake_http_request_duration_seconds_count{route="/v1/intake"}[{{.window}}]))
    alerting:
      name: IntakeLatency
      labels: { category: latency }
      annotations:
        summary: Intake requests are slower than 1 second.
        runbook: ops/runbooks/model-degraded.md
      page_alert: { labels: { severity: page } }
      ticket_alert: { labels: { severity: ticket } }

  - name: intake-live
    objective: 99
    description: >-
      Intakes planned by the model rather than the degraded fallback. Degraded plans are safe
      but ask every question and send everyone to a human, so they spend this budget.
    sli:
      events:
        error_query: (sum(rate(intake_plans_total{mode="degraded"}[{{.window}}])) or vector(0))
        total_query: sum(rate(intake_plans_total[{{.window}}]))
    alerting:
      name: IntakeDegraded
      labels: { category: quality }
      annotations:
        summary: Intakes are falling back to the degraded plan; the model is failing or slow.
        runbook: ops/runbooks/model-degraded.md
      page_alert: { labels: { severity: page } }
      ticket_alert: { labels: { severity: ticket } }
