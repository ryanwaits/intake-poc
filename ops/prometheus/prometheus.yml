global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: intake
    static_configs:
      - targets: ['intake:8080']

  # Black-box: availability measured from outside the process, so a dead process counts.
  - job_name: intake-probe
    metrics_path: /probe
    params: { module: [http_ready] }
    static_configs:
      - targets: ['http://intake:8080/readyz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
