# Hand-written guards for what the SLO rules can't see. Sloth owns intake-slo.yml; edit this one.
# - No data: an SLI with no series is silent, not healthy. Game day found two such queries.
# - Black-box: the SLIs are measured by the service itself, so a dead process reports nothing.
#   The probe measures from outside, where a dead process counts.
groups:
  - name: intake-no-data
    rules:
      - alert: IntakeSLINoData
        expr: absent(slo:sli_error:ratio_rate5m{sloth_service="intake", sloth_slo="intake-availability"})
        for: 15m
        labels: { severity: ticket, category: no-data, sloth_slo: intake-availability }
        annotations: &no-data
          summary: An SLI has had no data for 15 minutes, so its alerts cannot fire.
          runbook: ops/runbooks/blind-or-down.md
      - alert: IntakeSLINoData
        expr: absent(slo:sli_error:ratio_rate5m{sloth_service="intake", sloth_slo="intake-latency"})
        for: 15m
        labels: { severity: ticket, category: no-data, sloth_slo: intake-latency }
        annotations: *no-data
      - alert: IntakeSLINoData
        expr: absent(slo:sli_error:ratio_rate5m{sloth_service="intake", sloth_slo="intake-live"})
        for: 15m
        labels: { severity: ticket, category: no-data, sloth_slo: intake-live }
        annotations: *no-data

  - name: intake-blackbox
    rules:
      - alert: IntakeProbeFailing
        expr: probe_success{job="intake-probe"} == 0
        for: 2m
        labels: { severity: page, category: availability }
        annotations:
          summary: The service is not answering its readiness probe from outside.
          runbook: ops/runbooks/blind-or-down.md
      - alert: IntakeProbeNoData
        expr: absent(probe_success{job="intake-probe"})
        for: 10m
        labels: { severity: ticket, category: no-data }
        annotations:
          summary: The black-box probe has stopped reporting, so outside availability is unmeasured.
          runbook: ops/runbooks/blind-or-down.md
